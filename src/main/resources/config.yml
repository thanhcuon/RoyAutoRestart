# ==============================================================================
#                      ROYAUTORESTART CONFIGURATION FILE
# ==============================================================================
# Plugin tự động khởi động lại máy chủ Minecraft chuyên nghiệp, an toàn, mượt mà.
# Hỗ trợ đầy đủ: Spigot, Bukkit, Paper, Leaf, Purpur, Folia (1.18.x -> 26.x)
# Tác giả: athanh (RoyMC)
# ==============================================================================

# Cấu hình ngôn ngữ hiển thị của plugin.
# Các tệp ngôn ngữ nằm trong thư mục 'lang/'.
# Tuỳ chọn có sẵn:
#   - vi_vn : Tiếng Việt (Mặc định)
#   - en_us : Tiếng Anh (English)
# Bạn có thể tự thêm file ngôn ngữ mới vào thư mục lang/ (ví dụ: zh_cn.yml, ja_jp.yml) và điền tên file vào đây.
language: "vi_vn"

# ==============================================================================
#                      CẤU HÌNH MÚI GIỜ (TIMEZONE CONFIGURATION)
# ==============================================================================
# Thiết lập múi giờ cho máy chủ để đảm bảo lịch restart-schedule chạy chuẩn xác 100%
# theo giờ địa phương của bạn, tránh lệch giờ khi thuê VPS/Dedicated tại nước ngoài
# (Ví dụ: VPS ở Đức/Pháp chạy UTC+1/UTC+2, Mỹ chạy UTC-5/UTC-8, Singapore chạy UTC+8).
#
# Mặc định chuẩn Việt Nam: "Asia/Ho_Chi_Minh" (GMT+7)
#
# Các định dạng múi giờ hợp lệ:
#   - Tên khu vực / Thành phố chuẩn IANA:
#       + Việt Nam:        "Asia/Ho_Chi_Minh" hoặc "Asia/Saigon" (GMT+7)
#       + Nhật Bản / Hàn:  "Asia/Tokyo", "Asia/Seoul" (GMT+9)
#       + Singapore:       "Asia/Singapore" (GMT+8)
#       + Châu Âu:         "Europe/London" (GMT+0/+1), "Europe/Paris", "Europe/Berlin" (GMT+1/+2)
#       + Châu Mỹ:         "America/New_York" (GMT-5/-4), "America/Los_Angeles" (GMT-8/-7)
#   - Độ lệch GMT/UTC:     "GMT+7", "UTC+7", "+07:00", "UTC+0", "GMT-5", v.v.
#   - Dùng giờ gốc hệ điều hành máy chủ VPS: "SYSTEM"
timezone: "Asia/Ho_Chi_Minh"

# ==============================================================================
#                       LỊCH KHỞI ĐỘNG LẠI (RESTART SCHEDULE)
# ==============================================================================
# Định dạng cấu hình lịch restart (tính theo múi giờ 'timezone' đã cấu hình ở trên):
# 1. Hàng ngày:   'DAILY;HH:mm'    (Ví dụ: 'DAILY;12:00' -> Khởi động lại mỗi ngày lúc 12:00 trưa)
# 2. Thứ cụ thể:  'THỨ;HH:mm'      (Ví dụ: 'MONDAY;06:00' -> Thứ Hai lúc 06:00 sáng)
# Các thứ hợp lệ: MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY
# Thời gian theo định dạng 24 giờ (HH: 00-23, mm: 00-59).
restart-schedule:
  - 'DAILY;12:00'      # Khởi động lại hàng ngày vào lúc 12:00 trưa (Giờ Việt Nam)
  - 'DAILY;00:00'      # Khởi động lại hàng ngày vào lúc 00:00 nửa đêm (Giờ Việt Nam)
  - 'MONDAY;06:00'     # Thứ Hai lúc 06:00 sáng
  - 'FRIDAY;18:00'     # Thứ Sáu lúc 18:00 chiều

# Các mốc thời gian đếm ngược (tính bằng giây) trước khi máy chủ chính thức khởi động lại.
# Tại mỗi mốc này, plugin sẽ gửi thông báo Chat, Title, Action Bar, Âm thanh và Discord.
countdown-times:
  - 60
  - 30
  - 10
  - 5
  - 4
  - 3
  - 2
  - 1

# ==============================================================================
#                      CẤU HÌNH BUNGEECORD / VELOCITY LOBBY
# ==============================================================================
# Tự động gửi người chơi về máy chủ sảnh (Lobby) trước khi máy chủ khởi động lại
# để tránh người chơi bị văng ra khỏi mạng lưới máy chủ.
bungeecord:
  # Bật/Tắt tính năng chuyển người chơi về Lobby
  enabled: true
  
  # Tên máy chủ Lobby được cấu hình trong proxy (BungeeCord / Velocity / Waterfall)
  lobby-server: "lobby"
  
  # Khoảng thời gian chờ (tính bằng tick, 20 ticks = 1 giây) sau khi gửi người chơi về Lobby
  # trước khi thực hiện kick các người chơi còn sót lại và tắt máy chủ.
  send-delay-ticks: 20

# ==============================================================================
#                       CƠ CHẾ KHỞI ĐỘNG LẠI AN TOÀN (SAFE RESTART)
# ==============================================================================
# Đảm bảo dữ liệu máy chủ được bảo toàn nguyên vẹn, không gây lỗi thế giới hoặc crash.
safe-restart:
  # Tự động lưu toàn bộ dữ liệu thế giới (world.save()) trước khi tắt máy chủ
  save-worlds: true
  
  # Kick an toàn toàn bộ người chơi còn lại trên máy chủ trước khi dừng server
  kick-players-before-shutdown: true
  
  # Lệnh dùng để khởi động lại máy chủ trên Console.
  # Thường là: 'restart' (Spigot/Paper) hoặc 'stop' (đối với script loop tự bật lại)
  restart-command: "restart"
  
  # Danh sách các lệnh tuỳ chỉnh thực thi trên Console trước khi restart
  # Ví dụ: lưu dữ liệu các plugin khác ("save-all", "authme save", v.v.)
  commands-before-restart: []

# ==============================================================================
#                         HIỆU ỨNG ÂM THANH (SOUND EFFECTS)
# ==============================================================================
sound:
  # Bật/Tắt phát âm thanh đếm ngược cho người chơi
  enabled: true
  
  # Tên âm thanh trong Minecraft (Tương thích 1.18 -> 26.x)
  # Ví dụ: BLOCK_NOTE_BLOCK_PLING, ENTITY_EXPERIENCE_ORB_PICKUP, UI_BUTTON_CLICK
  name: "BLOCK_NOTE_BLOCK_PLING"
  
  # Âm lượng (Volume)
  volume: 1.0
  
  # Cao độ (Pitch)
  pitch: 1.2
